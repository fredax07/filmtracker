name: Release

on:
  push:
    branches: [main]
    paths: [custom_components/filmtracker/manifest.json, RELEASE_NOTES.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Release für neue Version anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version custom_components/filmtracker/manifest.json)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon"
            exit 0
          fi
          if [ -f RELEASE_NOTES.md ]; then
            gh release create "$TAG" --title "Filmtracker $VERSION" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "Filmtracker $VERSION" --generate-notes
          fi
